<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Yapper</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --panel-2: #232735; --line: #2e3344; --text: #e7e9ef; --muted: #8b91a5;
    --accent: #7fbf3f; --danger: #ef4444; --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10140b; font-weight: 600; }
  button.danger:hover { border-color: var(--danger); color: #fca5a5; }
  button.icon { padding: 2px 7px; font-size: 13px; }
  input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .group { display: flex; align-items: center; gap: 6px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #22c55e; } .dot.warn { background: #f59e0b; } .dot.bad { background: var(--danger); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 11px; }
  .seg button.on { background: var(--accent); color: #10140b; font-weight: 700; }
  .spacer { flex: 1; }

  #voicebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #speaker { display: flex; align-items: center; gap: 10px; min-width: 240px; padding: 6px 14px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line); }
  #speaker .who { font-weight: 700; font-size: 16px; }
  #speaker .team { font-size: 12px; color: var(--muted); }
  #speaker .mic { font-size: 20px; opacity: .4; }
  #speaker.talking .mic { opacity: 1; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.2); } }
  #test { display: flex; gap: 6px; margin-left: auto; }
  #test input { width: 220px; }

  main { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), minmax(190px, 1fr)); gap: 12px; padding: 12px 16px; overflow: auto; min-height: 0; }
  .col { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-height: 0; border-top: 4px solid var(--team, var(--muted)); }
  .col.drop { outline: 2px dashed var(--team, var(--accent)); outline-offset: -2px; }
  .col-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .col-title { display: flex; align-items: center; gap: 8px; }
  .col-title h2 { margin: 0; font-size: 15px; text-transform: capitalize; color: var(--team, var(--text)); }
  .count { font-size: 12px; color: var(--muted); background: var(--panel-2); padding: 1px 8px; border-radius: 999px; }
  /* color-scheme must match the overlay document, otherwise the iframe gets an opaque white canvas */
  .preview { width: 64px; height: 64px; border: 0; border-radius: 8px; background: var(--bg); flex: none; pointer-events: none; color-scheme: normal; }
  .tint { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .tint input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  .tint input[type=range] { flex: 1; min-width: 50px; accent-color: var(--team); }
  .members { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 5px; overflow: auto; flex: 1; min-height: 60px; }
  .members:empty::after { content: attr(data-empty); color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; cursor: grab; user-select: none; }
  .chip.dragging { opacity: .4; }
  .chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .acts { display: flex; gap: 3px; opacity: 0; transition: opacity .1s; }
  .chip:hover .acts, .chip:focus-within .acts { opacity: 1; }
  .chip.active { border-color: var(--team, var(--accent)); box-shadow: 0 0 0 1px var(--team, var(--accent)) inset; }
  .chip.active .name::before { content: "🎤 "; }
  .add { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  .add input { flex: 1; }

  #drawer { border-top: 1px solid var(--line); background: var(--panel); }
  #drawer summary { padding: 9px 16px; cursor: pointer; color: var(--muted); }
  .drawer-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px 16px 14px; }
  .drawer-body h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .urls { display: flex; flex-direction: column; gap: 5px; }
  .url { display: flex; gap: 6px; align-items: center; }
  .url code { flex: 1; background: var(--bg); padding: 5px 8px; border-radius: 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uploads { display: flex; gap: 12px; flex-wrap: wrap; }
  .upload { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; background: var(--bg); border: 1px dashed var(--line); border-radius: var(--radius); width: 150px; }
  .upload.drop { border-color: var(--accent); }
  .upload img { width: 90px; height: 90px; object-fit: contain; }
  .upload .ph { width: 90px; height: 90px; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; }
  .upload .label { font-size: 12px; color: var(--muted); }

  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: var(--radius); background: var(--panel-2);
    border: 1px solid var(--line); white-space: pre-wrap; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 10; }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-color: var(--danger); color: #fecaca; }
  #offline { position: fixed; inset: 0; background: #12141ae6; display: none; place-items: center; z-index: 20; font-size: 16px; color: var(--muted); }
  #offline.show { display: grid; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .drawer-body { grid-template-columns: 1fr; }
    #test { margin-left: 0; width: 100%; } #test input { flex: 1; }
  }
</style>
</head>
<body>
<header>
  <h1>Goblin <span>Yapper</span></h1>
  <div class="group">
    <span class="pill"><span class="dot" id="chatDot"></span><span id="chatStatus">desligado</span></span>
    <input type="text" id="channel" placeholder="canal da twitch" size="14" spellcheck="false">
    <button id="channelBtn">Conectar</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="queueBtn">Abrir fila</button>
    <span class="pill">times</span>
    <div class="seg" id="teamCount"></div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="primary" data-cmd="sort" title="Sorteia quem está na fila">Sortear</button>
    <button data-cmd="resort" title="Devolve todos à fila e sorteia de novo">Re-sortear</button>
    <button data-cmd="reset" title="Devolve todos dos times à fila">Devolver à fila</button>
    <button class="danger" data-cmd="clear" data-confirm="Limpar fila e times?">Limpar</button>
  </div>
</header>

<section id="voicebar">
  <div id="speaker"><span class="mic">🎤</span><div><div class="who" id="speakerName">ninguém com a voz</div><div class="team" id="speakerTeam">escolha um time ou uma pessoa</div></div></div>
  <button data-cmd="next" id="nextBtn" title="Outra pessoa do mesmo time">Próximo do time</button>
  <button data-cmd="voice any" title="Qualquer time">Aleatório geral</button>
  <button class="danger" data-cmd="stop">Parar voz</button>
  <form id="test"><input type="text" id="testText" placeholder="testar TTS no goblin do time…"><button>Falar</button></form>
</section>

<main id="board"></main>

<details id="drawer">
  <summary>Overlay do OBS e imagens do goblin</summary>
  <div class="drawer-body">
    <div>
      <h3>Fontes de navegador para o OBS</h3>
      <div class="urls" id="urls"></div>
      <h3 style="margin-top:14px">Pasta de dados</h3>
      <div class="pill" id="dataInfo"></div>
    </div>
    <div>
      <h3>Imagens (tingidas por time)</h3>
      <div class="uploads">
        <label class="upload" data-file="goblin.png"></label>
        <label class="upload" data-file="goblin.gif"></label>
      </div>
    </div>
  </div>
</details>

<div id="toast"></div>
<div id="offline">conectando ao servidor…</div>

<script>
const TEAM_COLORS_FALLBACK = { azul: "#3b82f6", verde: "#22c55e", roxo: "#a855f7", amarelo: "#facc15" };
let state = null, ws = null, assetFiles = [];
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- server ---------------------------------------------------------
let toastTimer;
function toast(text, err = false) {
  const t = $("#toast");
  t.textContent = text; t.classList.toggle("err", err); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), err ? 5000 : 2200);
}

async function cmd(command, { quiet = false } = {}) {
  try {
    const r = await fetch("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command }) });
    const data = await r.json();
    const err = data.output.startsWith("erro");
    if (err || !quiet) toast(data.output.split("\n")[0], err);
    state = data.state; render();
    return !err;
  } catch (e) { toast("servidor indisponível", true); return false; }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $("#offline").classList.remove("show");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") { state = msg; render(); }
    else if (msg.type === "speak" || msg.type === "idle" || msg.type === "stop") setTalking(msg.type === "speak" ? msg.team : null, msg.type === "speak");
    else if (msg.type === "assets") loadAssets();
    else if (msg.type === "notice") toast(msg.text, true);
  };
  ws.onclose = () => { $("#offline").classList.add("show"); setTimeout(connect, 1200); };
}

// ---- render ---------------------------------------------------------
function teamColor(t) { return state?.tints?.[t]?.color || TEAM_COLORS_FALLBACK[t] || "#8b91a5"; }

let boardKey = "";
function render() {
  if (!state) return;
  const chat = state.chat;
  $("#chatStatus").textContent = chat.channel ? `#${chat.channel} · ${chat.status}` : "chat desligado";
  $("#chatDot").className = "dot " + ({ conectado: "ok", conectando: "warn", reconectando: "bad" }[chat.status] || "");
  if (document.activeElement !== $("#channel")) $("#channel").value = chat.channel;
  $("#channelBtn").textContent = chat.channel && $("#channel").value === chat.channel ? "Desconectar" : "Conectar";

  const queueBtn = $("#queueBtn");
  queueBtn.textContent = state.queue_open ? "Fechar fila" : "Abrir fila";
  queueBtn.classList.toggle("primary", !state.queue_open);

  const teams = Object.keys(state.teams);
  $("#teamCount").innerHTML = [1, 2, 3, 4].map(n => `<button class="${n === teams.length ? "on" : ""}" data-teams="${n}">${n}</button>`).join("");

  const v = state.voice;
  $("#speakerName").textContent = v.user || "ninguém com a voz";
  $("#speakerTeam").textContent = v.user ? (v.team ? `time ${v.team}` : "sem time") : "escolha um time ou uma pessoa";
  $("#speaker").style.borderColor = v.team ? teamColor(v.team) : "";
  $("#nextBtn").disabled = !v.user;

  renderBoard(teams);
  renderUrls(teams);
  $("#dataInfo").textContent = `${state.data_dir || "-"}  ·  TTS: ${state.tts_engine}` +
    (state.tts_error ? `  (falha ao carregar: ${state.tts_error})` : "");
}

function renderBoard(teams) {
  const board = $("#board");
  // Rebuild column skeletons only when the team set changes, so iframes/inputs survive updates.
  const key = teams.join(",");
  if (key !== boardKey) {
    boardKey = key;
    board.style.setProperty("--cols", teams.length + 1);
    board.innerHTML = colHtml("fila", "Fila", false) + teams.map(t => colHtml(t, t, true)).join("");
  }
  fillMembers($('[data-col="fila"]'), state.queue, "ninguém na fila — !joinsort");
  $('[data-col="fila"] .count').textContent = state.queue.length;
  for (const t of teams) {
    const col = $(`[data-col="${t}"]`);
    const tint = state.tints[t];
    col.style.setProperty("--team", tint.color);
    if (document.activeElement?.closest(`[data-col="${t}"] .tint`) == null) {
      $(".tint-color", col).value = tint.color;
      $(".tint-strength", col).value = Math.round(tint.strength * 100);
    }
    $(".count", col).textContent = state.teams[t].length;
    $(".voice-btn", col).disabled = state.teams[t].length === 0;
    fillMembers(col, state.teams[t], "vazio");
  }
}

function colHtml(id, title, isTeam) {
  return `<section class="col" data-col="${id}">
    <div class="col-head">
      <div class="col-title">
        ${isTeam ? `<iframe class="preview" src="/overlay?team=${id}&audio=0&label=0&size=64" tabindex="-1"></iframe>` : ""}
        <div style="flex:1;min-width:0">
          <div class="col-title"><h2>${esc(title)}</h2><span class="count">0</span></div>
          ${isTeam ? `<button class="voice-btn" data-cmd="voice ${id}" style="margin-top:6px">🎤 Sortear voz</button>` : ""}
        </div>
      </div>
      ${isTeam ? `<div class="tint" title="Tinta do goblin">tinta <input type="color" class="tint-color" data-team="${id}">
        <input type="range" class="tint-strength" data-team="${id}" min="0" max="100"></div>` : ""}
    </div>
    <ul class="members" data-empty="${isTeam ? "vazio" : "ninguém na fila — !joinsort"}"></ul>
    ${isTeam ? "" : `<form class="add"><input type="text" placeholder="adicionar nick" spellcheck="false"><button>+</button></form>`}
  </section>`;
}

function fillMembers(col, people) {
  const activeId = state.voice.id;
  $(".members", col).innerHTML = people.map(p => `
    <li class="chip ${p.id === activeId ? "active" : ""}" draggable="true" data-user="${esc(p.id)}">
      <span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="acts">
        <button class="icon" data-cmd="give ${esc(p.id)}" title="Dar a voz">🎤</button>
        <button class="icon danger" data-cmd="remove ${esc(p.id)}" title="Remover">✕</button>
      </span>
    </li>`).join("");
}

function setTalking(team, talking) {
  $("#speaker").classList.toggle("talking", talking);
}

function renderUrls(teams) {
  const base = `${location.protocol}//${location.host}/overlay`;
  const rows = [["Principal (com áudio)", base], ...teams.map(t => [`Só ${t} (sem áudio)`, `${base}?team=${t}&audio=0`])];
  const html = rows.map(([label, url]) => `<div class="url"><span style="width:150px;color:var(--muted);font-size:12px">${label}</span><code>${esc(url)}</code><button class="icon" data-copy="${esc(url)}">copiar</button></div>`).join("");
  if ($("#urls").innerHTML !== html) $("#urls").innerHTML = html;
}

// ---- assets ---------------------------------------------------------
async function loadAssets() {
  try { assetFiles = (await (await fetch("/api/assets")).json()).files; } catch { assetFiles = []; }
  for (const el of document.querySelectorAll(".upload")) {
    const f = el.dataset.file, has = assetFiles.includes(f);
    const label = f.endsWith(".png") ? "parado (.png)" : "falando (.gif)";
    el.innerHTML = `${has ? `<img src="/assets/${f}?t=${Date.now()}">` : `<div class="ph">arraste ou clique para enviar</div>`}
      <span class="label">${label}</span>
      <input type="file" accept="${f.endsWith(".png") ? "image/png" : "image/gif"}" hidden>
      ${has ? `<button class="icon danger" data-delete="${f}">remover</button>` : ""}`;
  }
}

async function uploadAsset(file, name) {
  const r = await fetch(`/api/assets/${name}`, { method: "PUT", body: file });
  if (r.ok) toast(`${name} atualizado`); else toast(await r.text(), true);
  loadAssets();
}

// ---- events ---------------------------------------------------------
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.cmd) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    cmd(b.dataset.cmd);
  } else if (b.dataset.teams) cmd(`teams ${b.dataset.teams}`);
  else if (b.dataset.copy) { navigator.clipboard.writeText(b.dataset.copy).then(() => toast("copiado")); }
  else if (b.dataset.delete) { e.preventDefault(); await fetch(`/api/assets/${b.dataset.delete}`, { method: "DELETE" }); loadAssets(); }
  else if (b.id === "queueBtn") cmd(state.queue_open ? "close" : "open");
  else if (b.id === "channelBtn") {
    const c = $("#channel").value.trim();
    cmd(state.chat.channel && c === state.chat.channel ? "channel off" : `channel ${c || "off"}`);
  }
});

$("#channel").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#channelBtn").click(); });
$("#channel").addEventListener("input", () => render());

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "test") {
    const text = $("#testText").value.trim();
    if (!text) return;
    cmd(`test ${state.voice.team || "-"} ${text}`, { quiet: true });
    $("#testText").value = "";
  } else if (e.target.classList.contains("add")) {
    const input = $("input", e.target), name = input.value.trim();
    if (name && !/\s/.test(name)) cmd(`add ${name}`, { quiet: true }).then(ok => ok && (input.value = ""));
  }
});

// tint: color applies on change, strength while dragging (throttled)
let tintTimer;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.dataset.team) return;
  const col = t.closest(".col");
  const color = $(".tint-color", col).value, strength = $(".tint-strength", col).value / 100;
  col.style.setProperty("--team", color);
  clearTimeout(tintTimer);
  tintTimer = setTimeout(() => cmd(`tint ${t.dataset.team} ${color} ${strength}`, { quiet: true }), 120);
});

// drag & drop chatters between columns
let dragUser = null;
document.addEventListener("dragstart", (e) => {
  const chip = e.target.closest?.(".chip");
  if (!chip) return;
  dragUser = chip.dataset.user;
  chip.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragUser);
});
document.addEventListener("dragend", (e) => { e.target.closest?.(".chip")?.classList.remove("dragging"); dragUser = null; clearDrop(); });
function clearDrop() { document.querySelectorAll(".drop").forEach(el => el.classList.remove("drop")); }
document.addEventListener("dragover", (e) => {
  const col = e.target.closest?.(".col"), up = e.target.closest?.(".upload");
  if ((col && dragUser) || (up && e.dataTransfer.types.includes("Files"))) {
    e.preventDefault();
    clearDrop(); (col || up).classList.add("drop");
  }
});
document.addEventListener("drop", (e) => {
  const col = e.target.closest?.(".col"), up = e.target.closest?.(".upload");
  clearDrop();
  if (up && e.dataTransfer.files.length) { e.preventDefault(); uploadAsset(e.dataTransfer.files[0], up.dataset.file); return; }
  if (!col || !dragUser) return;
  e.preventDefault();
  const from = e.target.closest(".col") && document.querySelector(`.chip[data-user="${CSS.escape(dragUser)}"]`)?.closest(".col")?.dataset.col;
  if (from !== col.dataset.col) cmd(`move ${dragUser} ${col.dataset.col}`, { quiet: true });
});
document.addEventListener("change", (e) => {
  const up = e.target.closest(".upload");
  if (up && e.target.files?.length) uploadAsset(e.target.files[0], up.dataset.file);
});

$("#offline").classList.add("show");
fetch("/api/state").then(r => r.json()).then(s => { state = s; render(); }).catch(() => {});
loadAssets();
connect();
</script>
</body>
</html>
