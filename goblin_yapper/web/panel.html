<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Yapper</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --panel-2: #232735; --line: #2e3344; --text: #e7e9ef; --muted: #8b91a5;
    --accent: #7fbf3f; --danger: #ef4444; --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10140b; font-weight: 600; }
  button.danger:hover { border-color: var(--danger); color: #fca5a5; }
  button.icon { padding: 2px 7px; font-size: 13px; }
  input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 8px 0 0; line-height: 0; }
  header h1 .logo { display: block; height: 30px; width: auto; }
  .group { display: flex; align-items: center; gap: 6px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #22c55e; } .dot.warn { background: #f59e0b; } .dot.bad { background: var(--danger); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 11px; }
  .seg button.on { background: var(--accent); color: #10140b; font-weight: 700; }
  .spacer { flex: 1; }

  #voicebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #speakers { display: flex; flex-wrap: wrap; gap: 8px; }
  .spk { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--team, var(--line)); min-width: 180px; }
  .spk .who { font-weight: 700; font-size: 15px; }
  .spk .team { font-size: 12px; color: var(--team, var(--muted)); }
  .spk .mic { font-size: 18px; opacity: .4; }
  .spk.talking .mic { opacity: 1; animation: pulse .5s infinite alternate; }
  .spk.empty { color: var(--muted); border-style: dashed; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); }
  .voice-acts { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  @keyframes pulse { to { transform: scale(1.2); } }
  #autobar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #autobar .auto { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  #autobar .volume { margin-left: auto; }
  #autobar input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }
  #autobar output { min-width: 3.2em; font-variant-numeric: tabular-nums; }
  #autobar input[type=number] { width: 58px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
  #test { display: flex; gap: 6px; margin-left: auto; }
  #test input { width: 220px; }

  main { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), minmax(190px, 1fr)); gap: 12px; padding: 12px 16px; overflow: auto; min-height: 0; }
  .col { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-height: 0; border-top: 4px solid var(--team, var(--muted)); }
  .col.drop { outline: 2px dashed var(--team, var(--accent)); outline-offset: -2px; }
  .col-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .col-title { display: flex; align-items: center; gap: 8px; }
  .col-title h2 { margin: 0; font-size: 15px; text-transform: capitalize; color: var(--team, var(--text)); }
  .count { font-size: 12px; color: var(--muted); background: var(--panel-2); padding: 1px 8px; border-radius: 999px; }
  /* color-scheme must match the overlay document, otherwise the iframe gets an opaque white canvas */
  .preview { width: 64px; height: 64px; border: 0; border-radius: 8px; background: var(--bg); flex: none; pointer-events: none; color-scheme: normal; }
  .tint { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .tint input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  /* thin tint bar: filled up to --pct (set from the value) in the team color */
  .tint input[type=range] { flex: 1; min-width: 50px; height: 4px; border-radius: 2px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(to right, var(--team) var(--pct, 50%), var(--line) var(--pct, 50%)); }
  .tint input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 11px; height: 11px;
    border-radius: 50%; background: var(--team); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--team); }
  .members { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 5px; overflow: auto; flex: 1; min-height: 60px; }
  .members:empty::after { content: attr(data-empty); color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; cursor: grab; user-select: none; }
  .chip.dragging { opacity: .4; }
  .chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .acts { display: flex; gap: 3px; opacity: 0; transition: opacity .1s; }
  .chip:hover .acts, .chip:focus-within .acts { opacity: 1; }
  .chip.active { border-color: var(--team, var(--accent)); box-shadow: 0 0 0 1px var(--team, var(--accent)) inset; }
  .chip.active .name::before { content: "🎤 "; }
  .add { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  .add input { flex: 1; }

  #drawer { border-top: 1px solid var(--line); background: var(--panel); }
  #drawer summary { padding: 9px 16px; cursor: pointer; color: var(--muted); }
  .drawer-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px 16px 14px; }
  .drawer-body h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .images-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; margin-bottom: 8px; }
  .images-head h3 { margin: 0; }
  .gif-speed { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .gif-speed input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .gif-speed output { min-width: 3.2em; font-variant-numeric: tabular-nums; }
  .urls { display: flex; flex-direction: column; gap: 5px; }
  .url { display: flex; gap: 6px; align-items: center; }
  .url code { flex: 1; background: var(--bg); padding: 5px 8px; border-radius: 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #uploads { display: flex; flex-direction: column; gap: 8px; }
  .up-row { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; }
  .up-row b { text-transform: capitalize; color: var(--team, var(--text)); font-size: 13px; }
  .upload { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bg); border: 1px dashed var(--line);
    border-radius: var(--radius); min-width: 0; cursor: pointer; }
  .upload.drop { border-color: var(--accent); }
  .upload img { width: 48px; height: 48px; object-fit: contain; flex: none; }
  .upload img.fallback { opacity: .3; }
  .upload .ph { width: 48px; height: 48px; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 10px; text-align: center; line-height: 1.1; }
  .upload .label { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
  .drawer-body { max-height: 46vh; overflow: auto; }

  /* hint menus: the voice style terms and speech tags, under the button that opened them */
  #hintMenu { position: fixed; z-index: 15; width: min(340px, calc(100vw - 16px)); max-height: 60vh; overflow: auto;
    display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: 0 8px 24px #0009; }
  #hintMenu[hidden] { display: none; }
  #hintMenu h3 { margin: 0; font-size: 13px; }
  #hintMenu h4 { margin: 4px 0 0; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  #hintMenu .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  #hintMenu .chips button { padding: 2px 9px; font-size: 12px; border-radius: 999px; }
  #hintMenu .chips button.on { background: var(--accent); border-color: var(--accent); color: #10140b; }
  #hintMenu code { margin-left: 5px; font-size: 11px; color: var(--muted); }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: var(--radius); background: var(--panel-2);
    border: 1px solid var(--line); white-space: pre-wrap; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 10; }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-color: var(--danger); color: #fecaca; }
  #offline { position: fixed; inset: 0; background: #12141ae6; display: none; place-items: center; z-index: 20; font-size: 16px; color: var(--muted); }
  #offline.show { display: grid; }

  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; padding: 6px 16px; font-weight: 600; }
  .tabs button.on { background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body[data-tab="voz"] #tab-goblin, body:not([data-tab="voz"]) #tab-voz, body[data-tab="voz"] .game-only { display: none; }
  /* ---- Voz tab ---- */
  #tab-voz { overflow: auto; }
  #vzStatus { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #vzStatus select, .card select, .card textarea, .card input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #vzBanner { margin: 12px 16px 0; padding: 12px 14px; border-radius: var(--radius); border: 1px solid #f59e0b; background: #f59e0b14; }
  #vzBanner code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
  .vz-log { margin: 8px 0 0; max-height: 160px; overflow: auto; background: var(--bg); border-radius: 6px; padding: 8px;
    font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  #vzGrid { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 12px; padding: 12px 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .card textarea { width: 100%; resize: vertical; font: inherit; }
  .card .row { display: flex; gap: 6px; align-items: center; }
  .card .row > select, .card .row > input[type=text] { flex: 1; min-width: 0; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .field-label { font-size: 12px; color: var(--muted); }
  .vz-drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 12px; border: 2px dashed var(--line);
    border-radius: var(--radius); background: var(--bg); cursor: pointer; text-align: center; }
  .vz-drop span { font-size: 12px; color: var(--muted); }
  .vz-drop.over { border-color: var(--accent); background: #7fbf3f12; }
  .vz-drop.disabled { opacity: .5; pointer-events: none; }
  .vz-opts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .vz-opts input[type=number] { width: 56px; padding: 2px 6px; }
  .vz-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .vz-steps li { display: flex; gap: 8px; color: var(--muted); }
  .vz-steps li::before { content: "○"; width: 14px; text-align: center; }
  .vz-steps li.running { color: var(--text); } .vz-steps li.running::before { content: "◌"; animation: spin 1s linear infinite; display: inline-block; }
  .vz-steps li.done { color: var(--text); } .vz-steps li.done::before { content: "✓"; color: #22c55e; }
  .vz-steps li.error { color: #fca5a5; } .vz-steps li.error::before { content: "✕"; }
  .vz-steps li .detail { color: var(--muted); font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #vzDraft { display: flex; flex-direction: column; gap: 8px; }
  #vzDraft[hidden] { display: none; }
  audio { width: 100%; height: 34px; }
  .vz-profiles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .vz-profiles:empty::after { content: attr(data-empty); color: var(--muted); font-size: 12px; }
  .vz-profile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .vz-profile .top { display: flex; align-items: center; gap: 6px; }
  .vz-profile .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vz-profile .meta, .vz-profile .ref { font-size: 12px; color: var(--muted); }
  .vz-profile .ref { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .vz-profile .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--bg); color: var(--team, var(--muted)); border: 1px solid var(--team, var(--line)); }
  .vz-profile .edit { display: flex; flex-direction: column; gap: 6px; }
  .param { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .param:last-child { border-bottom: 0; }
  .param .label { font-size: 13px; }
  .param .label.overridden { color: var(--accent); font-weight: 600; }
  .param .ctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .param .ctl input[type=range] { flex: 1; accent-color: var(--accent); }
  .param .ctl output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .param .ctl select, .param .ctl input[type=text] { flex: 1; min-width: 0; }
  .param .help { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
  .param .reset { padding: 0 6px; font-size: 12px; visibility: hidden; }
  .param .reset.show { visibility: visible; }
  .param.inherited .ctl { opacity: .6; }
  #vzAdvanced summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
  .team-voice { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; padding: 4px 0; }
  .team-voice b { text-transform: capitalize; color: var(--team, var(--text)); }
  @media (max-width: 1100px) { #vzGrid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px) { #vzGrid { grid-template-columns: 1fr; } }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .drawer-body { grid-template-columns: 1fr; }
    #test { margin-left: 0; width: 100%; } #test input { flex: 1; }
  }
  body:not(.i18n-ready) { visibility: hidden; }
</style>
</head>
<body>
<header>
  <h1>
    <svg class="logo" viewBox="0 0 660 92" role="img" aria-label="Goblin Yapper">
    <path fill="var(--accent)" transform="translate(3.62 84) scale(0.3867)" d="M135-27.9L150.6-76.8L81.3-96.3L73.2-69L119.4-57.3L36.9-26.4C44.1-99.9 70.2-161.1 134.1-180.6L114-112.2L147.9-103.2L174-179.7C161.1-192 141-202.8 122.4-210C40.8-195.6-2.7-108.3-4.2-15L47.1 6.3M160.2-14.1L218.4 6C261.9-2.4 295.8-54.3 294.3-121.8L234.9-145.8C190.5-137.4 156.6-82.2 160.2-14.1M212.7-20.1L196.5-26.4C199.8-58.5 216-95.1 239.1-117.9L255.9-110.4C251.1-76.2 235.5-41.7 212.7-20.1M373.2 6C420 1.2 462.3-68.1 462.6-125.7L410.7-145.8L352.5-62.4L405.9-196.5L369.6-210L291-10.5L325.2 6L337.2-24.6M351.9-36.9L413.1-116.7L424.2-111.9C414.3-74.1 389.7-41.7 364.5-27.3M454.5-10.5L488.7 6L569.4-196.5L533.1-210M631.8-199.5L598.5-205.8C593.1-191.7 591-177.3 591.9-162.6L623.1-156.6M566.4 6L619.5-131.7L583.8-145.5L528.6-10.5M731.7 6L771.6-120.6L740.1-145.8C720.6-131.7 696.6-105 675-76.5L694.8-128.7L660-142.5L605.7-10.5L643.8 6L658.2-32.1L719.7-104.7L727.5-98.1C708.6-66.3 696.3-34.5 692.4-10.5"/>
    <path fill="var(--text)" d="M368 6 H634 Q656 6 656 28 V64 Q656 86 634 86 H368 Q346 86 346 64 V60 L320 50 L346 36 V28 Q346 6 368 6 Z"/>
    <g transform="translate(369.05 25.70) scale(0.29)" fill="none" stroke="var(--bg)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M0 0 V40 Q0 72 32 72 H88 Q120 72 120 40 V0 M60 72 V140"/><path transform="translate(158 0)" d="M6 0 H88 Q120 0 120 32 V140 H32 Q0 140 0 108 V102 Q0 70 32 70 H120"/><path transform="translate(316 0)" d="M0 140 V0 H88 Q120 0 120 32 V52 Q120 84 88 84 H0"/><path transform="translate(474 0)" d="M0 140 V0 H88 Q120 0 120 32 V52 Q120 84 88 84 H0"/><path transform="translate(632 0)" d="M0 70 H120 V32 Q120 0 88 0 H32 Q0 0 0 32 V108 Q0 140 32 140 H114"/><path transform="translate(790 0)" d="M0 140 V0 H88 Q120 0 120 32 V48 Q120 80 88 80 H0 M70 80 H88 Q120 80 120 112 V140"/></g>
    </svg>
  </h1>
  <nav class="tabs"><button data-tab-btn="goblin" class="on" data-i18n="tab.goblin"></button><button data-tab-btn="voz" data-i18n="tab.voice"></button></nav>
  <div class="group">
    <span class="pill"><span class="dot" id="chatDot"></span><span id="chatStatus"></span></span>
    <input type="text" id="channel" data-i18n-placeholder="channel.placeholder" size="14" spellcheck="false">
    <button id="channelBtn"></button>
  </div>
  <div class="sep game-only"></div>
  <div class="group game-only">
    <button id="queueBtn"></button>
    <span class="pill" data-i18n="label.teams"></span>
    <div class="seg" id="teamCount"></div>
  </div>
  <div class="sep game-only"></div>
  <div class="group game-only">
    <button class="primary" data-cmd="sort" data-i18n="btn.sort" data-i18n-title="tip.sort"></button>
    <button data-cmd="resort" data-i18n="btn.resort" data-i18n-title="tip.resort"></button>
    <button data-cmd="reset" data-i18n="btn.reset" data-i18n-title="tip.reset"></button>
    <button class="danger" data-cmd="clear" data-i18n="btn.clear" data-i18n-confirm="confirm.clear"></button>
  </div>
  <div class="group" style="margin-left:auto">
    <label class="pill"><span data-i18n="lang.label"></span>
      <select id="langSel"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option></select>
    </label>
  </div>
</header>

<div class="tab" id="tab-goblin">
<section id="voicebar">
  <div id="speakers"></div>
  <label class="toggle" data-i18n-title="tip.multivoice">
    <input type="checkbox" id="multiVoice"> <span data-i18n="opt.multivoice"></span></label>
  <button data-cmd="next" id="nextBtn" data-i18n="btn.next_in_team" data-i18n-title="tip.next_in_team"></button>
  <button data-cmd="voice any" data-i18n="btn.any_team" data-i18n-title="tip.any_team"></button>
  <button class="danger" data-cmd="stop" id="stopAllBtn"></button>
  <button data-cmd="skip" id="skipBtn" disabled data-i18n="btn.skip" data-i18n-title="tip.skip"></button>
  <span class="pill" id="lineInfo"></span>

<div id="hintMenu" hidden></div>
<div id="toast"></div>
<div id="offline" data-i18n="offline.connecting"></div>

<script src="/web/i18n.js"></script>
<script>
const TEAM_COLORS_FALLBACK = { azul: "#3b82f6", verde: "#22c55e", roxo: "#a855f7", amarelo: "#facc15" };
let state = null, ws = null, assetFiles = [];
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- server ---------------------------------------------------------
let toastTimer;
function toast(text, err = false) {
  const t = $("#toast");
  t.textContent = text; t.classList.toggle("err", err); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), err ? 5000 : 2200);
}

async function cmd(command, { quiet = false } = {}) {
  try {
    const r = await fetch("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command, language: i18n.lang }) });
    const data = await r.json();
    const err = !data.ok;
    if (err || !quiet) toast(i18n.fromServer(data).split("\n")[0], err);
    state = data.state; await applyStateLanguage(); render();
    return !err;
  } catch (e) { toast(t("toast.server_unavailable"), true); return false; }
}

// Last-resort player: the server only asks the panel to play a line (msg.play) when no OBS overlay
// can, so voices can be tested without OBS open.
// Lines in progress: id -> {team, user, audio (the ones played here)}; several when every team speaks together.
const lines = new Map();
function panelPlay(msg) {
  const audio = lines.get(msg.id).audio = new Audio(msg.url);
  audio.volume = (state?.volume ?? 100) / 100;
  const done = () => { if (lines.get(msg.id)?.audio === audio) { lines.get(msg.id).audio = null; ws.send(JSON.stringify({ type: "ended", id: msg.id })); } };
  audio.onended = audio.onerror = done;
  audio.play().catch(done);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    $("#offline").classList.remove("show");
    ws.send(JSON.stringify({ type: "hello", role: "panel", team: null, audio: true }));
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") { state = msg; applyStateLanguage().then(render); }
    else if (msg.type === "speak" || msg.type === "idle" || msg.type === "stop") {
      if (msg.type === "speak") {
        lines.set(msg.id, { team: msg.team, user: msg.user });
        if (msg.play) panelPlay(msg);
      } else {
        const audio = lines.get(msg.id)?.audio;
        if (audio) { audio.onended = audio.onerror = null; audio.pause(); }
        lines.delete(msg.id);
      }
      talkingUser = [...lines.values()].pop()?.user ?? null;
      setTalking(); renderLine();
    }
    else if (msg.type === "assets") loadAssets();
    else if (msg.type === "notice") toast(msg.items ? msg.items.map(i18n.fromServer).join("; ") : msg.key ? i18n.fromServer(msg) : msg.text, !msg.ok);
  };
  ws.onclose = () => {
    // their "idle" would be missed while offline
    for (const line of lines.values()) line.audio?.pause();
    lines.clear(); talkingUser = null; setTalking(); renderLine();
    $("#offline").classList.add("show"); setTimeout(connect, 1200);
  };
}

// ---- render ---------------------------------------------------------
function teamColor(id) { return state?.tints?.[id]?.color || TEAM_COLORS_FALLBACK[id] || "#8b91a5"; }
const TEAM_NAMES = () => ({ azul: t("team.azul"), verde: t("team.verde"), roxo: t("team.roxo"), amarelo: t("team.amarelo") });
const teamName = (id) => TEAM_NAMES()[id] ?? id;

let boardKey = "";
function render() {
  if (!state) return;
  const chat = state.chat;
  const chatStatus = { connecting: t("chat.connecting"), connected: t("chat.connected"), reconnecting: t("chat.reconnecting") };
  $("#chatStatus").textContent = chat.channel ? `#${chat.channel} · ${chatStatus[chat.status] ?? chat.status}` : t("chat.off");
  $("#chatDot").className = "dot " + ({ connected: "ok", connecting: "warn", reconnecting: "bad" }[chat.status] || "");
  if (document.activeElement !== $("#channel")) $("#channel").value = chat.channel;
  $("#channelBtn").textContent = chat.channel && $("#channel").value === chat.channel ? t("btn.disconnect") : t("btn.connect");

  const queueBtn = $("#queueBtn");
  queueBtn.textContent = state.queue_open ? t("queue.close") : t("queue.open");
  queueBtn.classList.toggle("primary", !state.queue_open);

  const teams = Object.keys(state.teams);
  $("#teamCount").innerHTML = [1, 2, 3, 4].map(n => `<button class="${n === teams.length ? "on" : ""}" data-teams="${n}">${n}</button>`).join("");

  renderSpeakers();
  $("#multiVoice").checked = state.multi_voice;
  $("#hideIdle").checked = state.hide_idle;
  // speech tags are read by the voice server's engine only (not by the Windows voices)
  document.querySelectorAll("[data-hints=tags]").forEach(b => { b.hidden = state.tts_engine !== "server"; });
  if (document.activeElement !== $("#volume")) $("#volume").value = state.volume;
  $("#volumeOut").textContent = `${$("#volume").value}%`;
  if (document.activeElement !== $("#gifSpeed")) $("#gifSpeed").value = state.gif_speed;
  $("#gifSpeedOut").textContent = `${$("#gifSpeed").value}%`;
  for (const line of lines.values()) if (line.audio) line.audio.volume = state.volume / 100;
  $("#nextBtn").disabled = !state.voice.user;
  $("#stopAllBtn").textContent = state.multi_voice && state.speakers.length > 1 ? t("btn.stop_all") : t("btn.stop_voice");
  renderLine();
  for (const [id, opt] of [["autoRemove", state.auto_remove], ["autoRotate", state.auto_rotate]]) {
    $(`#${id}`).checked = opt.on;
    if (document.activeElement !== $(`#${id}Min`)) $(`#${id}Min`).value = opt.minutes;
  }

  renderBoard(teams);
  renderUrls(teams);
  renderUploads(teams);
  $("#dataInfo").textContent = t("data.info", { dir: state.data_dir || "-", engine: state.tts_engine }) +
    (state.tts_error ? "  " + t("data.load_failed", { error: state.tts_error }) : "");
  vzOnState();
}

function renderBoard(teams) {
  const board = $("#board");
  // Rebuild column skeletons only when the team set changes, so iframes/inputs survive updates.
  const key = teams.join(",");
  if (key !== boardKey) {
    boardKey = key;
    board.style.setProperty("--cols", teams.length + 1);
    board.innerHTML = colHtml("fila", t("col.queue"), false) + teams.map(tm => colHtml(tm, teamName(tm), true)).join("");
  }
  fillMembers($('[data-col="fila"]'), state.queue);
  $('[data-col="fila"] .count').textContent = state.queue.length;
  for (const tm of teams) {
    const col = $(`[data-col="${tm}"]`);
    const tint = state.tints[tm];
    col.style.setProperty("--team", tint.color);
    if (document.activeElement?.closest(`[data-col="${tm}"] .tint`) == null) {
      $(".tint-color", col).value = tint.color;
      $(".tint-strength", col).value = Math.round(tint.strength * 100);
    }
    $(".tint-strength", col).style.setProperty("--pct", $(".tint-strength", col).value + "%");
    $(".count", col).textContent = state.teams[tm].length;
    // per-team voice buttons: draw a speaker, or next/stop when the team already has one
    const hasSpeaker = (state.speakers || []).some(sp => sp.team === tm);
    const empty = state.teams[tm].length === 0 ? "disabled" : "";
    const profile = (state.team_profiles || {})[tm] || (state.team_profiles || {}).default;
    const detail = profile ? t("detail.profile_chosen") : t("detail.no_profile");
    const acts = (hasSpeaker
      ? `<button data-cmd="next ${tm}" ${state.teams[tm].length < 2 ? "disabled" : ""} title="${esc(t("tip.next_this_team"))}">${esc(t("btn.next_short"))}</button>
         <button class="danger" data-cmd="stop ${tm}" title="${esc(t("tip.stop_team"))}">${esc(t("btn.stop_short"))}</button>`
      : `<button data-cmd="voice ${tm}" ${empty}>${esc(t("btn.draw_voice"))}</button>`)
      + `<button data-cmd="testvoice ${tm}" title="${esc(t("tip.test_voice", { detail }))}">${esc(t("btn.test_voice"))}</button>`;
    if ($(".voice-acts", col).innerHTML !== acts) $(".voice-acts", col).innerHTML = acts;
    fillMembers(col, state.teams[tm]);
  }
}

function colHtml(id, title, isTeam) {
  return `<section class="col" data-col="${id}">
    <div class="col-head">
      <div class="col-title">
        ${isTeam ? `<iframe class="preview" src="/overlay?team=${id}&audio=0&label=0&size=64&preview=1" tabindex="-1"></iframe>` : ""}
        <div style="flex:1;min-width:0">
          <div class="col-title"><h2>${esc(title)}</h2><span class="count">0</span></div>
          ${isTeam ? `<div class="voice-acts"></div>` : ""}
        </div>
      </div>
      ${isTeam ? `<div class="tint" title="${esc(t("tip.tint"))}">${esc(t("tint.label"))} <input type="color" class="tint-color" data-team="${id}">
        <input type="range" class="tint-strength" data-team="${id}" min="0" max="100"></div>` : ""}
    </div>
    <ul class="members" data-empty="${esc(isTeam ? t("col.team_empty") : t("col.queue_empty"))}"></ul>
    ${isTeam ? "" : `<form class="add"><input type="text" placeholder="${esc(t("add.placeholder"))}" spellcheck="false"><button>+</button></form>`}
  </section>`;
}

function fillMembers(col, people) {
  const speakerIds = new Set((state.speakers || []).map(sp => sp.id));
  $(".members", col).innerHTML = people.map(p => `
    <li class="chip ${speakerIds.has(p.id) ? "active" : ""}" draggable="true" data-user="${esc(p.id)}">
      <span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="acts">
        <button class="icon" data-cmd="give ${esc(p.id)}" title="${esc(t("tip.give_voice"))}">🎤</button>
        <button class="icon danger" data-cmd="remove ${esc(p.id)}" title="${esc(t("tip.remove"))}">✕</button>
      </span>
    </li>`).join("");
}

// teams of the lines playing now ("" = no team)
const talkingTeams = () => new Set([...lines.values()].map(l => l.team ?? ""));
function setTalking() {
  const teams = talkingTeams();
  document.querySelectorAll(".spk[data-team]").forEach(el => el.classList.toggle("talking", teams.has(el.dataset.team)));
}

// The line in progress: being generated by the TTS (from the state) or playing (from speak/idle).
let talkingUser = null;
function renderLine() {
  const gen = state?.generating;
  $("#lineInfo").textContent = gen ? t("line.generating", { user: gen.user }) : talkingUser ? t("line.speaking", { user: talkingUser }) : "";
  $("#skipBtn").disabled = !gen && !talkingUser;
}

function renderSpeakers() {
  const list = state.speakers || [];
  const talking = talkingTeams();
  $("#speakers").innerHTML = list.length ? list.map(sp => `
    <div class="spk ${talking.has(sp.team ?? "") ? "talking" : ""}"
         data-team="${esc(sp.team ?? "")}" style="--team:${sp.team ? teamColor(sp.team) : "var(--line)"}">
      <span class="mic">🎤</span>
      <div style="flex:1;min-width:0"><div class="who">${esc(sp.user)}</div><div class="team">${esc(sp.team ? t("spk.team", { team: teamName(sp.team) }) : t("spk.no_team"))}</div></div>
      <button class="icon danger" data-cmd="stop ${esc(sp.id)}" title="${esc(t("spk.take_voice", { user: sp.user }))}">✕</button>
    </div>`).join("")
    : `<div class="spk empty"><span class="mic">🎤</span><div><div class="who">${esc(t("spk.none"))}</div>
         <div class="team">${esc(t("spk.hint"))}</div></div></div>`;
}

function renderUrls(teams) {
  const base = `${location.protocol}//${location.host}/overlay`;
  const overlays = state.overlays || [];
  // [label, url, pinned team (null = main)]
  const rows = [[t("url.main"), base, null], ...teams.map(tm => [t("url.team", { team: teamName(tm) }), `${base}?team=${tm}`, tm])];
  const html = rows.map(([label, url, team]) => {
    const mine = overlays.filter(o => o.team === team);
    const status = !mine.length ? t("url.not_connected") : mine.some(o => o.audio) ? t("url.connected") : t("url.connected_no_audio");
    return `<div class="url"><span class="dot ${mine.length ? "ok" : ""}" title="${status}"></span>
      <span style="width:96px;color:${team ? teamColor(team) : "var(--muted)"};font-size:12px;text-transform:capitalize">${label}</span>
      <code>${esc(url)}</code><button class="icon" data-copy="${esc(url)}">${esc(t("btn.copy"))}</button></div>`;
  }).join("") + `<p class="hint" style="margin-top:6px">${esc(t("url.hint"))}</p>`;
  if ($("#urls").innerHTML !== html) $("#urls").innerHTML = html;
}

// one row of png+gif slots for the shared goblin, then one per team
let uploadsKey = null;
function renderUploads(teams) {
  const key = teams.join(",");
  if (key !== uploadsKey) {
    uploadsKey = key;
    const row = (stem, label) => `<div class="up-row" data-row="${stem}"><b>${label}</b>
      <label class="upload" data-file="${stem}.png"></label><label class="upload" data-file="${stem}.gif"></label></div>`;
    $("#uploads").innerHTML = row("goblin", t("up.default")) + teams.map(tm => row(tm, teamName(tm))).join("");
    loadAssets();
  }
  for (const tm of teams) $(`.up-row[data-row="${tm}"]`).style.setProperty("--team", teamColor(tm));
}

// ---- assets ---------------------------------------------------------
async function loadAssets() {
  try { assetFiles = (await (await fetch("/api/assets")).json()).files; } catch { assetFiles = []; }
  for (const el of document.querySelectorAll(".upload")) {
    const f = el.dataset.file, has = assetFiles.includes(f);
    const ext = f.split(".")[1], shared = `goblin.${ext}`;
    const label = ext === "png" ? t("up.still") : t("up.talking");
    // an empty team slot shows what that team uses instead: the shared image, or the built-in goblin
    const empty = f === shared ? `<div class="ph">${esc(t("up.drop"))}</div>`
      : assetFiles.includes(shared) ? `<img class="fallback" src="/assets/${shared}?t=${Date.now()}" title="${esc(t("up.using_default"))}">`
      : `<div class="ph">${esc(t("up.uses_default"))}</div>`;
    el.innerHTML = `${has ? `<img src="/assets/${f}?t=${Date.now()}">` : empty}
      <span class="label">${label}</span>
      <input type="file" accept="${f.endsWith(".png") ? "image/png" : "image/gif"}" hidden>
      ${has ? `<button class="icon danger" data-delete="${f}">${esc(t("btn.remove_asset"))}</button>` : ""}`;
  }
}

async function uploadAsset(file, name) {
  const r = await fetch(`/api/assets/${name}`, { method: "PUT", body: file });
  if (r.ok) toast(t("toast.asset_updated", { name })); else toast(await errorText(r), true);
  loadAssets();
}

// ---- events ---------------------------------------------------------
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.cmd) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    cmd(b.dataset.cmd);
  } else if (b.dataset.teams) cmd(`teams ${b.dataset.teams}`);
  else if (b.dataset.copy) { navigator.clipboard.writeText(b.dataset.copy).then(() => toast(t("toast.copied"))); }
  else if (b.dataset.delete) { e.preventDefault(); await fetch(`/api/assets/${b.dataset.delete}`, { method: "DELETE" }); loadAssets(); }
  else if (b.id === "queueBtn") cmd(state.queue_open ? "close" : "open");
  else if (b.id === "channelBtn") {
    const c = $("#channel").value.trim();
    cmd(state.chat.channel && c === state.chat.channel ? "channel off" : `channel ${c || "off"}`);
  }
});

$("#multiVoice").addEventListener("change", (e) => cmd(`multivoice ${e.target.checked ? "on" : "off"}`));
$("#hideIdle").addEventListener("change", (e) => cmd(`hideidle ${e.target.checked ? "on" : "off"}`));
// while dragging: just the number; on release: the overlays get the new volume (even mid-line)
$("#volume").addEventListener("input", (e) => { $("#volumeOut").textContent = `${e.target.value}%`; });
$("#volume").addEventListener("change", (e) => cmd(`volume ${e.target.value}`, { quiet: true }));
$("#gifSpeed").addEventListener("input", (e) => { $("#gifSpeedOut").textContent = `${e.target.value}%`; });
$("#gifSpeed").addEventListener("change", (e) => cmd(`gifspeed ${e.target.value}`, { quiet: true }));
for (const [id, command] of [["autoRemove", "autoremove"], ["autoRotate", "autorotate"]]) {
  const send = () => cmd(`${command} ${$(`#${id}`).checked ? "on" : "off"} ${$(`#${id}Min`).value}`.trim());

$("#channel").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#channelBtn").click(); });
$("#channel").addEventListener("input", () => render());

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "test") {
    const text = $("#testText").value.trim();
    if (!text) return;
    cmd(`test ${state.voice.team || "-"} ${text}`, { quiet: true });
    $("#testText").value = "";
  } else if (e.target.classList.contains("add")) {
    const input = $("input", e.target), name = input.value.trim();
    if (name && !/\s/.test(name)) cmd(`add ${name}`, { quiet: true }).then(ok => ok && (input.value = ""));

// tint: color applies on change, strength while dragging (throttled)
let tintTimer;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.dataset.team) return;
  const col = t.closest(".col");
  const color = $(".tint-color", col).value, strength = $(".tint-strength", col).value / 100;
  col.style.setProperty("--team", color);
  $(".tint-strength", col).style.setProperty("--pct", strength * 100 + "%");
  clearTimeout(tintTimer);
  tintTimer = setTimeout(() => cmd(`tint ${t.dataset.team} ${color} ${strength}`, { quiet: true }), 120);
});

// drag & drop chatters between columns
let dragUser = null;
document.addEventListener("dragstart", (e) => {
  const chip = e.target.closest?.(".chip");
  if (!chip) return;
  dragUser = chip.dataset.user;
  chip.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragUser);
});
document.addEventListener("dragend", (e) => { e.target.closest?.(".chip")?.classList.remove("dragging"); dragUser = null; clearDrop(); });
function clearDrop() { document.querySelectorAll(".drop").forEach(el => el.classList.remove("drop")); }
document.addEventListener("dragover", (e) => {
  const col = e.target.closest?.(".col"), up = e.target.closest?.(".upload");
  if ((col && dragUser) || (up && e.dataTransfer.types.includes("Files"))) {
    e.preventDefault();
    clearDrop(); (col || up).classList.add("drop");
  }
});
document.addEventListener("drop", (e) => {
  const col = e.target.closest?.(".col"), up = e.target.closest?.(".upload");
  clearDrop();
  if (up && e.dataTransfer.files.length) { e.preventDefault(); uploadAsset(e.dataTransfer.files[0], up.dataset.file); return; }
  if (!col || !dragUser) return;
  e.preventDefault();
  const from = e.target.closest(".col") && document.querySelector(`.chip[data-user="${CSS.escape(dragUser)}"]`)?.closest(".col")?.dataset.col;
  if (from !== col.dataset.col) cmd(`move ${dragUser} ${col.dataset.col}`, { quiet: true });
});
document.addEventListener("change", (e) => {
  const up = e.target.closest(".upload");
  if (up && e.target.files?.length) uploadAsset(e.target.files[0], up.dataset.file);
});

$("#vzTestText").addEventListener("input", (e) => { e.target.dataset.edited = "1"; });
$("#langSel").addEventListener("change", (e) => cmd(`language ${e.target.value}`, { quiet: true }));

$("#offline").classList.add("show");
fetch("/api/state").then(r => r.json()).then(s => { state = s; return applyStateLanguage(); }).catch(() => setLanguage(i18n.resolveLanguage(null)))

// ---- Voz tab ---------------------------------------------------------
// Talks to the TTS server through the backend's /api/tts/* proxy.
const vz = { schema: null, settings: { params: {} }, profiles: [], status: null, draft: null,
             scope: "global", form: {}, dirty: false, timer: null, loaded: false, teamsKey: "" };
const profileAudio = new Audio();

// An error body from this app is {key, params, text}; anything else (the voice server's own errors) is shown as it came.
async function errorText(r) {
  const raw = await r.text();
  try { const e = JSON.parse(raw); if (e && e.key) return i18n.fromServer(e); } catch {}
  return raw || `HTTP ${r.status}`;
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await errorText(r));
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r;
}
const jsonOpts = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function setTab(tab) {
  document.body.dataset.tab = tab;
  document.querySelectorAll("[data-tab-btn]").forEach(b => b.classList.toggle("on", b.dataset.tabBtn === tab));
  try { localStorage.setItem("gy-tab", tab); } catch {}
  clearInterval(vz.timer);
  if (tab === "voz") { vzPoll(); vz.timer = setInterval(vzPoll, 2000); }
}

async function vzPoll() {
  try { vz.status = await api("/api/tts-service"); } catch { vz.status = { mode: "offline" }; }
  renderVzStatus();
  if (vz.status.server?.state !== "ready") { vz.loaded = false; return; }
  if (!vz.loaded) { vz.loaded = true; await vzLoadAll(); }
}

const INSTALL_STEPS = () => ({ uv: t("install.step.uv"), python: t("install.step.python"), torch: t("install.step.torch"),
                              omnivoice: t("install.step.omnivoice"), gpu: t("install.step.gpu") });
const installStep = (s) => INSTALL_STEPS()[s.id] ?? s.label;

// First-run install of the voice runtime (installed app). Returns banner HTML.
function installBanner(st) {
  const ins = st.install || {};
  if (ins.state === "running") {
    const cur = ins.steps.findIndex(s => s.id === ins.step);
    return `<b>${esc(t("vz.installing"))}</b> <span class="hint">${esc(t("vz.install_time", { elapsed: ins.elapsed ?? 0 }))}</span>
      <ol class="vz-steps" style="margin-top:8px">${ins.steps.map((s, i) =>
        `<li class="${i < cur ? "done" : i === cur ? "running" : ""}">${esc(installStep(s))}</li>`).join("")}</ol>
      <pre class="vz-log">${esc((ins.log || []).join("\n"))}</pre>`;
  }
  const retry = ins.state === "error"
    ? `<p style="color:#fca5a5;margin:8px 0">${esc(t("vz.install_failed", { error: ins.error }))}</p>` : "";
  return `<b>${esc(t("vz.install_title"))}</b>
    <p class="hint" style="margin:6px 0">${t("vz.install_body", { dir: ins.dir || "" }, true)}</p>${retry}
    <button class="primary" id="vzInstall">${esc(ins.state === "error" ? t("btn.retry") : t("btn.install"))}</button>`;
}

function renderVzStatus() {
  const st = vz.status, sv = st.server || {};
  let dot = "", text, banner = "";
  if (st.install?.state === "running") { dot = "warn"; text = t("vz.s.installing"); banner = installBanner(st); }
  else if (st.mode === "not_installed" && st.can_install) { dot = "bad"; text = t("vz.s.not_installed"); banner = installBanner(st); }
  else if (st.mode === "not_installed") {
    dot = "bad"; text = t("vz.s.not_installed");
    banner = t("vz.env_missing");
  } else if (st.mode === "exited") { dot = "bad"; text = t("vz.s.exited"); banner = t("vz.see_log", { log: st.log }, true); }
  else if (st.mode === "offline") { dot = "bad"; text = t("vz.s.offline"); }
  else if (st.mode === "stopped") { text = t("vz.s.stopped"); }
  else if (st.mode === "disabled") { text = t("vz.s.disabled"); }
  else if (sv.state === "ready") {
    dot = "ok";
    text = [sv.label, t("vz.s.ready"), sv.gpu, sv.vram_model_gb != null ? t("vz.s.model_uses", { gb: sv.vram_model_gb }) : "",
            sv.vram_used_gb != null ? t("vz.s.vram", { used: sv.vram_used_gb, total: sv.vram_total_gb }) : "",
            sv.asr_loaded ? t("vz.s.whisper") : "", sv.busy ? `${sv.busy}…` : "",
            st.mode === "external" ? t("vz.s.external") : ""].filter(Boolean).join(" · ");
  } else if (sv.state === "error") { dot = "bad"; text = t("vz.s.error"); banner = `${esc(sv.error)}<br>${t("vz.log_line", { log: st.log }, true)}`; }
  else { dot = "warn"; text = t("vz.s.loading"); }
  $("#vzProfilesDir").textContent = sv.profiles_dir ? t("vz.profiles_dir", { dir: sv.profiles_dir }) : "";
  $("#vzDot").className = "dot " + dot;
  $("#vzStatusText").textContent = text;
  $("#vzBanner").hidden = !banner;
  if ($("#vzBanner").innerHTML !== banner) $("#vzBanner").innerHTML = banner;
  $("#vzRestart").disabled = st.mode === "external";
  $("#vzPurgeAsr").hidden = !(sv.state === "ready" && sv.asr_loaded);
  // on/off is for the server the app itself runs; "exited" (it crashed) can be turned on again
  const off = st.mode === "stopped" || st.mode === "exited";
  $("#vzPower").textContent = off ? t("btn.power_on") : t("btn.power_off");
  $("#vzPower").dataset.action = off ? "start" : "stop";
  $("#vzPower").disabled = !off && st.mode !== "managed";
  $("#vzDrop").classList.toggle("disabled", sv.state !== "ready");
  $("#vzSpeak").disabled = sv.state !== "ready";
}

async function vzLoadAll() {
  try {
    [vz.schema, vz.settings, vz.profiles] = await Promise.all(
      [api("/api/tts/schema"), api("/api/tts/settings"), api("/api/tts/profiles")]);
  } catch (e) { toast(e.message, true); vz.loaded = false; return; }
  vzResetForm(); renderScope(); renderParams(); renderProfiles(); renderTestProfiles(); vz.teamsKey = ""; renderTeamVoices();
}

async function vzReloadProfiles() {
  vz.profiles = await api("/api/tts/profiles");
  renderScope(); renderProfiles(); renderTestProfiles(); vz.teamsKey = ""; renderTeamVoices();
}

// called from render() on every state update
function vzOnState() {
  if (document.activeElement !== $("#vzEngine")) $("#vzEngine").value = state.tts_engine;
  if (vz.loaded) { renderTeamVoices(); renderProfiles(); }
}

// -- parameters

function vzResetForm() {
  const src = vz.scope === "global" ? vz.settings.params : vz.profiles.find(p => p.id === vz.scope)?.params;
  vz.form = { ...(src || {}) };
  vz.dirty = false;
  $("#vzSave").disabled = true;
}

function renderScope() {
  if (vz.scope !== "global" && !vz.profiles.some(p => p.id === vz.scope)) { vz.scope = "global"; vzResetForm(); }
  $("#vzScope").innerHTML = `<option value="global">${esc(t("vz.scope_global"))}</option>` +
    vz.profiles.map(p => `<option value="${esc(p.id)}">${esc(t("vz.scope_profile", { name: p.name }))}</option>`).join("");
  $("#vzScope").value = vz.scope;
  $("#vzScopeHint").textContent = vz.scope === "global" ? t("vz.scope_hint_global") : t("vz.scope_hint_profile");
}

function inherited(p) {
  return vz.scope === "global" ? p.default : (vz.settings.params[p.key] ?? p.default);
}

function fmt(p, v) {
  if (p.type === "int") return String(v);
  return Number(v).toFixed(p.step < 0.1 ? 2 : p.step < 1 ? 1 : 0);
}

// The voice server sends labels and help in one language; the catalog's "param.<key>.label|help" wins when it has the key.
function paramText(p, field) {
  const key = `param.${p.key}.${field}`, text = t(key);
  return text === key ? p[field] : text;
}

function paramHtml(p) {
  const over = p.key in vz.form, val = over ? vz.form[p.key] : inherited(p);
  let ctl;
  if (p.type === "bool") ctl = `<input type="checkbox" data-param="${p.key}" ${val ? "checked" : ""}> <span class="hint">${val ? t("vz.on") : t("vz.off")}</span>`;
  else if (p.type === "select") ctl = `<select data-param="${p.key}">${p.options.map(o =>
    `<option value="${esc(o.value)}" ${o.value === val ? "selected" : ""}>${esc(o.value === "auto" ? t("param.language.auto") : o.label)}</option>`).join("")}</select>`;
  else if (p.type === "text") ctl = `<input type="text" data-param="${p.key}" value="${esc(val ?? "")}">` +
    (p.key === vz.schema.hints?.style_param ? `<button type="button" class="icon" data-hints="style" title="${esc(t("tip.style_hints"))}">${esc(t("btn.hints"))}</button>` : "");
  else ctl = `<input type="range" data-param="${p.key}" min="${p.min}" max="${p.max}" step="${p.step ?? (p.type === "int" ? 1 : 0.01)}" value="${val}"><output>${fmt(p, val)}</output>`;
  return `<div class="param ${over || vz.scope === "global" ? "" : "inherited"}">
    <span class="label ${over ? "overridden" : ""}">${esc(paramText(p, "label"))}</span>
    <button class="icon reset ${over ? "show" : ""}" data-reset="${p.key}" title="${esc(vz.scope === "global" ? t("tip.reset_global") : t("tip.reset_inherit"))}">↺</button>
    <div class="ctl">${ctl}</div>${paramText(p, "help") ? `<div class="help">${esc(paramText(p, "help"))}</div>` : ""}</div>`;
}

function renderParams() {
  if (!vz.schema) return;
  const ps = vz.schema.params;
  $("#vzParams").innerHTML = ps.filter(p => p.group !== "advanced").map(paramHtml).join("");
  $("#vzParamsAdv").innerHTML = ps.filter(p => p.group === "advanced").map(paramHtml).join("");
}

function readParam(p, el) {
  if (p.type === "bool") return el.checked;
  if (p.type === "int") return parseInt(el.value, 10);
  if (p.type === "float") return parseFloat(el.value);
  return el.value;
}

function vzParamInput(e) {
  const el = e.target.closest("[data-param]");
  if (!el) return;
  const p = vz.schema.params.find(x => x.key === el.dataset.param);
  const v = readParam(p, el);
  vz.form[p.key] = v;
  vz.dirty = true;
  $("#vzSave").disabled = false;
  const row = el.closest(".param");
  row.classList.remove("inherited");
  $(".label", row).classList.add("overridden");
  $(".reset", row).classList.add("show");
  const out = $("output", row);
  if (out) out.textContent = fmt(p, v);
  if (p.type === "bool") $(".ctl .hint", row).textContent = v ? t("vz.on") : t("vz.off");
}

async function vzSave() {
  try {
    if (vz.scope === "global") vz.settings = await api("/api/tts/settings", jsonOpts("PUT", { params: vz.form }));
    else { await api(`/api/tts/profiles/${vz.scope}`, jsonOpts("PATCH", { params: vz.form })); await vzReloadProfiles(); }
    vzResetForm(); renderParams(); toast(t("toast.params_saved"));
  } catch (e) { toast(e.message, true); }
}

function vzSetScope(scope) {
  if (scope === vz.scope) return;
  if (vz.dirty && !confirm(t("confirm.discard_params"))) { $("#vzScope").value = vz.scope; return; }
  vz.scope = scope;
  vzResetForm(); renderScope(); renderParams();
}

// -- profile pipeline: prepare -> transcribe -> review -> create

function setStep(step, cls, detail = "") {
  const li = $(`#vzSteps [data-step="${step}"]`);
  li.className = cls;
  li.querySelector(".detail")?.remove();
  if (detail) li.insertAdjacentHTML("beforeend", ` <span class="detail">${esc(detail)}</span>`);
}

function resetPipeline() {
  vz.draft = null;
  ["prepare", "transcribe", "review", "create"].forEach(s => setStep(s, ""));
  $("#vzDraft").hidden = true;
  $("#vzRefText").value = ""; $("#vzName").value = ""; $("#vzFile").value = "";
}

async function vzHandleFile(file) {
  if (vz.status?.server?.state !== "ready") return toast(t("toast.server_not_ready"), true);
  resetPipeline();
  setStep("prepare", "running", file.name);
  const q = new URLSearchParams({ trim: $("#vzTrim").checked ? 1 : 0, normalize: $("#vzNorm").checked ? 1 : 0,
                                  max_seconds: $("#vzMax").value || 20 });
  let d;
  try { d = await api(`/api/tts/pipeline/prepare?${q}`, { method: "POST", body: file }); }
  catch (e) { setStep("prepare", "error", e.message); return; }
  vz.draft = d;
  setStep("prepare", "done", `${d.steps.map(s => s.detail).join(" · ")} → ${d.duration}s`);
  $("#vzDraft").hidden = false;
  $("#vzDraftAudio").src = `/api/tts${d.url}`;
  $("#vzName").value = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ");
  if ($("#vzAuto").checked) {
    setStep("transcribe", "running", t("step.whisper_wait"));
    try {
      const t = await api(`/api/tts/pipeline/${d.draft_id}/transcribe`, { method: "POST" });
      if (vz.draft !== d) return;
      $("#vzRefText").value = t.text;
      setStep("transcribe", "done", `${t.seconds}s`);
    } catch (e) { setStep("transcribe", "error", e.message); }
  } else setStep("transcribe", "done", t("step.skipped"));
  setStep("review", "running", t("step.review_hint"));
  $("#vzRefText").focus();
}

async function vzCreate() {
  const d = vz.draft;
  if (!d) return;
  const name = $("#vzName").value.trim(), ref_text = $("#vzRefText").value.trim();
  if (!ref_text) return toast(t("toast.transcript_required"), true);
  if (!name) return toast(t("toast.name_required"), true);
  setStep("review", "done"); setStep("create", "running");
  $("#vzCreate").disabled = true;
  try {
    const p = await api("/api/tts/profiles", jsonOpts("POST", { draft_id: d.draft_id, name, ref_text }));
    setStep("create", "done", p.name);
    toast(t("toast.profile_created", { name: p.name }));
    vz.draft = null; $("#vzDraft").hidden = true;
    await vzReloadProfiles();
    $("#vzTestProfile").value = p.id;
  } catch (e) { setStep("create", "error", e.message); }
  finally { $("#vzCreate").disabled = false; }
}

// -- profiles list

let profilesKey = "", editing = null;
function renderProfiles() {
  const used = {};
  for (const [t, id] of Object.entries(state?.team_profiles || {})) (used[id] ||= []).push(t);
  const key = JSON.stringify([vz.profiles, used, editing]);
  if (key === profilesKey) return;
  profilesKey = key;
  $("#vzProfiles").innerHTML = vz.profiles.map(p => {
    const own = Object.keys(p.params || {}).length;
    return `<li class="vz-profile" data-profile="${esc(p.id)}">
      <div class="top"><span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
        <button class="icon" data-vz="play" title="${esc(t("tip.play_ref"))}">▶</button>
        <button class="icon" data-vz="params" title="${esc(t("tip.profile_params"))}">⚙</button>
        <button class="icon" data-vz="edit" title="${esc(t("tip.profile_edit"))}">✎</button>
        <button class="icon danger" data-vz="delete" title="${esc(t("tip.profile_delete"))}">✕</button></div>
      <div class="meta">${esc(t("vz.meta_ref", { seconds: p.duration }))}${own ? ` · ${esc(t("vz.meta_own_params", { count: own }))}` : ""}${p.ready ? "" : ` · ${esc(t("vz.meta_not_ready"))}`}</div>
      ${editing === p.id ? `<div class="edit">
          <input type="text" class="e-name" value="${esc(p.name)}">
          <textarea class="e-text" rows="3">${esc(p.ref_text)}</textarea>
          <p class="hint">${esc(t("vz.edit_hint"))}</p>
          <div class="row"><button class="primary" data-vz="save-edit">${esc(t("btn.save"))}</button><button data-vz="cancel-edit">${esc(t("btn.cancel"))}</button>
            <button type="button" data-hints="tags" title="${esc(t("tip.tag_hints"))}" ${state?.tts_engine === "server" ? "" : "hidden"}>${esc(t("btn.tag_hints"))}</button></div>
        </div>` : `<div class="ref">“${esc(p.ref_text)}”</div>`}
      ${used[p.id] ? `<div class="tags">${used[p.id].map(tm =>
        `<span class="tag" style="--team:${tm === "default" ? "var(--muted)" : teamColor(tm)}">${tm === "default" ? esc(t("vz.default")) : esc(teamName(tm))}</span>`).join("")}</div>` : ""}
    </li>`;
  }).join("");
  syncProfilePlay();
}

// The ▶ of the profile whose reference is playing becomes ⏸.
let profilePlaying = null;
function syncProfilePlay() {
  document.querySelectorAll("#vzProfiles [data-vz=play]").forEach(b => {
    const on = !profileAudio.paused && b.closest("[data-profile]").dataset.profile === profilePlaying;
    b.textContent = on ? "⏸" : "▶";
    b.title = on ? t("tip.pause") : t("tip.play_ref");
  });
}
for (const ev of ["play", "pause", "ended", "error"]) profileAudio.addEventListener(ev, syncProfilePlay);

async function vzProfileAction(action, id, li) {
  if (action === "play") {
    // same profile again: pause / resume where it stopped; another profile: start that one
    if (profilePlaying !== id) { profilePlaying = id; profileAudio.src = `/api/tts/profiles/${id}/reference.wav`; }
    if (profileAudio.paused) profileAudio.play().catch(() => {}); else profileAudio.pause();
  }
  else if (action === "params") { vzSetScope(id); $("#vzScope").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  else if (action === "edit") { editing = id; renderProfiles(); }
  else if (action === "cancel-edit") { editing = null; renderProfiles(); }
  else if (action === "save-edit") {
    const btn = $("[data-vz=save-edit]", li);
    btn.disabled = true; btn.textContent = t("btn.saving");
    try {
      await api(`/api/tts/profiles/${id}`, jsonOpts("PATCH", { name: $(".e-name", li).value, ref_text: $(".e-text", li).value }));
      editing = null; await vzReloadProfiles(); toast(t("toast.profile_updated"));
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = t("btn.save"); }
  } else if (action === "delete") {
    const p = vz.profiles.find(x => x.id === id);
    if (!confirm(t("confirm.delete_profile", { name: p?.name }))) return;
    try {
      await api(`/api/tts/profiles/${id}`, { method: "DELETE" });
      for (const [t, pid] of Object.entries(state.team_profiles || {})) if (pid === id) await cmd(`teamvoice ${t} none`, { quiet: true });
      await vzReloadProfiles(); toast(t("toast.profile_deleted"));
    } catch (e) { toast(e.message, true); }
  }
}

// -- test speech

function renderTestProfiles() {
  const sel = $("#vzTestProfile"), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(t("vz.test_no_profile"))}</option>` +
    vz.profiles.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  sel.value = vz.profiles.some(p => p.id === cur) ? cur : (vz.profiles[0]?.id || "");
}

async function vzSpeak() {
  const text = $("#vzTestText").value.trim();
  if (!text) return;
  const profile = $("#vzTestProfile").value || null;
  const body = { text, profile };
  if (vz.scope === "global") body.global_params = vz.form;  // preview unsaved global edits
  else if (vz.scope === profile) body.params = vz.form;    // preview unsaved edits of this profile
  const btn = $("#vzSpeak");
  btn.disabled = true; $("#vzTestInfo").textContent = t("vz.generating");
  try {
    const r = await api("/api/tts/synthesize", jsonOpts("POST", body));
    const audio = $("#vzTestAudio");
    audio.src = URL.createObjectURL(await r.blob());
    audio.hidden = false; audio.play().catch(() => {});  // the player stays visible if autoplay is blocked
    $("#vzTestInfo").textContent = t("vz.test_info", { audio: r.headers.get("x-audio-seconds"), gen: r.headers.get("x-gen-seconds") });
  } catch (e) { toast(e.message, true); $("#vzTestInfo").textContent = ""; }
  finally { btn.disabled = false; }
}

// -- team voices

function renderTeamVoices() {
  if (!state) return;
  const teams = [...Object.keys(state.teams), "default"];
  const key = JSON.stringify([teams, state.team_profiles, vz.profiles.map(p => [p.id, p.name]), i18n.lang]);
  if (key === vz.teamsKey) return;
  vz.teamsKey = key;
  $("#vzTeams").innerHTML = teams.map(tm => {
    const none = tm === "default" ? t("vz.team_none_default") : t("vz.team_use_default");
    const cur = state.team_profiles?.[tm];
    return `<div class="team-voice" style="--team:${tm === "default" ? "var(--text)" : teamColor(tm)}">
      <b>${tm === "default" ? esc(t("vz.default")) : esc(teamName(tm))}</b>
      <select data-team-voice="${tm}"><option value="none">${esc(none)}</option>${vz.profiles.map(p =>
        `<option value="${esc(p.id)}" ${p.id === cur ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>`;
  }).join("") + `<p class="hint">${esc(t("vz.team_voices_hint"))}</p>`;
}

// -- wiring

document.querySelectorAll("[data-tab-btn]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tabBtn)));
$("#vzParams").addEventListener("input", vzParamInput);
$("#vzParamsAdv").addEventListener("input", vzParamInput);
for (const box of ["#vzParams", "#vzParamsAdv"]) $(box).addEventListener("click", (e) => {
  const b = e.target.closest("[data-reset]");
  if (!b) return;
  delete vz.form[b.dataset.reset];
  vz.dirty = true; $("#vzSave").disabled = false;
  renderParams();
});
$("#vzScope").addEventListener("change", (e) => vzSetScope(e.target.value));

// -- hint menus: the voice style terms and the speech tags, as the voice server's engine lists them

const hintMenu = $("#hintMenu");
let hintFor = null;  // {kind: "style" | "tags", field, button, lists}
// the catalog names a term or tag when it has it; otherwise it shows as the engine wrote it
const hintName = (key, fallback) => { const text = t(key); return text === key ? fallback : text; };
const styleTerms = (value) => value.split(",").map(s => s.trim()).filter(Boolean);

async function hintLists() {
  if (vz.schema?.hints) return vz.schema.hints;
  try { return (await api("/api/tts/schema")).hints || null; } catch { return null; }  // the Goblin tab, before the Voz tab loaded
}

function hintField(b) {
  if (b.dataset.for) return $(`#${b.dataset.for}`);
  const box = b.closest(".ctl, .edit");
  return $("textarea", box) || $("input[type=text]", box);
}

async function openHints(b) {
  if (hintFor?.button === b) return closeHints();
  const lists = await hintLists();
  if (!lists) return toast(t("hints.unavailable"), true);
  if (!(b.dataset.hints === "style" ? lists.style : lists.tags)?.length) return toast(t("hints.none"), true);
  hintFor = { kind: b.dataset.hints, field: hintField(b), button: b, lists };
  renderHints();
  hintMenu.hidden = false;
  const r = b.getBoundingClientRect(), w = hintMenu.offsetWidth, h = hintMenu.offsetHeight;
  hintMenu.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
  hintMenu.style.top = `${r.bottom + 4 + h < innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)}px`;
}

function closeHints() { hintMenu.hidden = true; hintFor = null; }

function renderHints() {
  const { kind, field, lists } = hintFor;
  if (kind === "style") {
    const chosen = new Set(styleTerms(field.value).map(s => s.toLowerCase()));
    const note = vz.scope === "global" ? t("hints.style_note") : t("hints.style_note_profile");
    hintMenu.innerHTML = `<h3>${esc(t("hints.style_title"))}</h3><p class="hint">${esc(note)}</p>` +
      lists.style.map(k => `<h4>${esc(hintName(`style_kind.${k.kind}`, k.kind))}</h4><div class="chips">${k.terms.map(term =>
        `<button type="button" class="${chosen.has(term) ? "on" : ""}" data-style-term="${esc(term)}" title="${esc(term)}">${esc(hintName(`style.${term.replace(/ /g, "_")}`, term))}</button>`).join("")}</div>`).join("");
  } else {
    hintMenu.innerHTML = `<h3>${esc(t("hints.tags_title"))}</h3><p class="hint">${esc(t("hints.tags_note"))}</p><div class="chips">` +
      lists.tags.map(tag => `<button type="button" data-tag="${esc(tag)}">${esc(hintName(`tag.${tag.slice(1, -1)}`, tag))}<code>${esc(tag)}</code></button>`).join("") + "</div>";
  }
}

// a term replaces the one of its kind already written; a term already written comes out
function toggleStyleTerm(term) {
  const { field, lists } = hintFor;
  const kindTerms = lists.style.find(k => k.terms.includes(term)).terms;
  const terms = styleTerms(field.value);
  const had = terms.some(s => s.toLowerCase() === term);
  const others = terms.filter(s => !kindTerms.includes(s.toLowerCase()));
  field.value = (had ? others : [...others, term]).join(", ");
  field.dispatchEvent(new Event("input", { bubbles: true }));  // the form sees it as typed
}

// a field nobody has clicked in yet has its cursor at the start: the tag goes at the end there
const placedCursor = new WeakSet();
document.addEventListener("focusin", (e) => placedCursor.add(e.target));

function insertTag(tag) {
  const { field } = hintFor;
  const placed = placedCursor.has(field);
  const start = placed ? field.selectionStart : field.value.length, end = placed ? field.selectionEnd : start;
  const before = start > 0 && !/\s/.test(field.value[start - 1]) ? " " : "";
  const after = end < field.value.length && !/\s/.test(field.value[end]) ? " " : "";
  field.setRangeText(before + tag + after, start, end, "end");
  field.focus();
  field.dispatchEvent(new Event("input", { bubbles: true }));
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b?.dataset.hints) { openHints(b); return; }
  if (!hintFor) return;
  if (!hintFor.field.isConnected) closeHints();  // its form was drawn again
  else if (b?.dataset.styleTerm) { toggleStyleTerm(b.dataset.styleTerm); renderHints(); }
  else if (b?.dataset.tag) insertTag(b.dataset.tag);
  else if (!hintMenu.contains(e.target)) closeHints();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && hintFor) closeHints(); });
$("#vzSave").addEventListener("click", vzSave);
$("#vzSpeak").addEventListener("click", vzSpeak);
$("#vzCreate").addEventListener("click", vzCreate);
$("#vzCancel").addEventListener("click", resetPipeline);
$("#vzBanner").addEventListener("click", async (e) => {
  if (e.target.id !== "vzInstall") return;
  e.target.disabled = true;
  try { vz.status = await api("/api/tts-service/install", { method: "POST" }); renderVzStatus(); }
  catch (err) { toast(err.message, true); e.target.disabled = false; }
});
$("#vzRestart").addEventListener("click", async () => {
  if (!confirm(t("confirm.restart"))) return;
  try { vz.status = await api("/api/tts-service/restart", { method: "POST" }); vz.loaded = false; renderVzStatus(); toast(t("toast.restarting")); }
  catch (e) { toast(e.message, true); }
});
$("#vzPurgeAsr").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try { await api("/api/tts/asr/release", { method: "POST" }); await vzPoll(); toast(t("toast.whisper_released")); }
  catch (err) { toast(err.message, true); }
  e.target.disabled = false;
});
$("#vzPower").addEventListener("click", async (e) => {
  const action = e.target.dataset.action;
  if (action === "stop" && !confirm(t("confirm.power_off"))) return;
  e.target.disabled = true;
  try { vz.status = await api(`/api/tts-service/${action}`, { method: "POST" }); vz.loaded = false; renderVzStatus(); toast(action === "stop" ? t("toast.model_off") : t("toast.model_on")); }
  catch (err) { toast(err.message, true); renderVzStatus(); }
});
$("#vzEngine").addEventListener("change", (e) => cmd(`engine ${e.target.value}`));
$("#vzTeams").addEventListener("change", (e) => {
  const sel = e.target.closest("[data-team-voice]");
  if (sel) cmd(`teamvoice ${sel.dataset.teamVoice} ${sel.value}`, { quiet: true });
});
$("#vzProfiles").addEventListener("click", (e) => {
  const b = e.target.closest("[data-vz]"), li = e.target.closest("[data-profile]");
  if (b && li) vzProfileAction(b.dataset.vz, li.dataset.profile, li);
});
const vzDrop = $("#vzDrop");
vzDrop.addEventListener("dragover", (e) => { e.preventDefault(); vzDrop.classList.add("over"); });
vzDrop.addEventListener("dragleave", () => vzDrop.classList.remove("over"));
vzDrop.addEventListener("drop", (e) => {
  e.preventDefault(); e.stopPropagation(); vzDrop.classList.remove("over");
  if (e.dataTransfer.files[0]) vzHandleFile(e.dataTransfer.files[0]);
});
$("#vzFile").addEventListener("change", (e) => { if (e.target.files[0]) vzHandleFile(e.target.files[0]); });
// A file dropped outside a drop zone would otherwise replace the page.
window.addEventListener("dragover", (e) => { if (e.dataTransfer?.types.includes("Files")) e.preventDefault(); });
window.addEventListener("drop", (e) => { if (e.dataTransfer?.types.includes("Files")) e.preventDefault(); });

// /panel#voz or #goblin opens that tab; otherwise the last one used
let initialTab = location.hash.slice(1);
if (!initialTab) try { initialTab = localStorage.getItem("gy-tab") || "goblin"; } catch {}
setTab(initialTab === "voz" ? "voz" : "goblin");
</script>
