<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Goblin Yapper Overlay</title>
<!--
  OBS browser source. Query params:
    ?team=azul   always show this team's goblin (animates only when that team speaks)
    ?audio=0     don't play audio here (use on extra per-team sources, keep one with audio)
    ?label=0     hide the speaker name
    ?size=400    goblin size in px
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .goblin { position: relative; width: var(--size); height: var(--size); isolation: isolate; transition: opacity .25s; }
  .goblin.hidden { opacity: 0; }
  .goblin img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Tint layer: masked by the goblin image so only its pixels get colored. */
  .goblin .tint { position: absolute; inset: 0; mix-blend-mode: color; pointer-events: none;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; }
  .label { margin-top: 6px; padding: 4px 14px; border-radius: 999px; color: #fff; font-weight: 700; font-size: calc(var(--size) / 14);
    text-shadow: 0 1px 3px #000a; background: #0008; transition: opacity .25s; }
  .label:empty, .label.hidden { opacity: 0; }
  /* Built-in goblin ("goburin", drawn as SVG; used when assets/ has no images).
     Talking: the closed frown is swapped for an open mouth that yaps, and the head bobs. */
  .ph .mouth-open { opacity: 0; transform-origin: 631px 772px; transform: scaleY(.3); }
  .ph.talking .mouth-closed { opacity: 0; }
  .ph.talking .mouth-open { opacity: 1; animation: yap .16s infinite alternate ease-in-out; }
  .ph.talking .head { animation: bob .32s infinite alternate ease-in-out; transform-origin: 630px 890px; }
  @keyframes yap { to { transform: scaleY(1); } }
  @keyframes bob { to { transform: rotate(3deg) translateY(-10px); } }
  #unlock { position: absolute; top: 8px; left: 8px; padding: 6px 10px; background: #000c; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="goblin hidden" id="goblin"></div>
  <div class="label hidden" id="label"></div>
</div>
<div id="unlock">clique para liberar o áudio</div>
<script>
const params = new URLSearchParams(location.search);
const PIN_TEAM = params.get("team");
const PLAY_AUDIO = params.get("audio") !== "0";
const SHOW_LABEL = params.get("label") !== "0";
document.documentElement.style.setProperty("--size", (params.get("size") || 360) + "px");

const goblinEl = document.getElementById("goblin");
const labelEl = document.getElementById("label");
const unlockEl = document.getElementById("unlock");
let assets = {}, state = null, talkingTeam = null, currentId = null;
const audio = new Audio();
let ws;

const PLACEHOLDER = (color) => `
<svg class="ph" viewBox="100 340 1056 576" width="100%" height="100%">
  <g class="head">
    <path fill="${color}" d="M425 505 C380 482 260 455 128 420 C112 417 110 432 122 441 C170 480 222 515 250 545 C292 600 328 668 360 688 C375 696 395 696 402 695 C430 760 520 862 630 888 C700 890 790 800 848 697 C890 690 930 660 960 620 C1000 570 1050 512 1134 442 C1146 432 1142 417 1127 420 C1020 448 900 484 832 512 C800 442 720 378 620 377 C530 378 460 430 425 505 Z"/>
    <ellipse cx="1014" cy="530" rx="24" ry="22" fill="#fff"/>
    <path fill="#fff" d="M425 612 C428 565 500 535 545 560 C570 590 548 640 495 642 C455 643 425 632 425 612 Z"/>
    <circle cx="510" cy="592" r="32" fill="#111"/><circle cx="507" cy="601" r="11" fill="#fff"/><circle cx="521" cy="578" r="5" fill="#fff"/>
    <path fill="#fff" d="M642 578 C660 520 740 482 795 510 C820 540 805 615 740 625 C690 630 655 600 642 578 Z"/>
    <circle cx="746" cy="553" r="35" fill="#111"/><circle cx="740" cy="565" r="12" fill="#fff"/><circle cx="759" cy="550" r="6" fill="#fff"/>
    <path class="mouth-closed" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" d="M577 775 C595 764 615 762 640 762 C660 762 672 768 686 775"/>
    <path class="mouth-open" fill="#2a0d0d" stroke="#fff" stroke-width="8" stroke-linejoin="round" d="M577 772 C600 752 662 752 686 772 C672 815 592 815 577 772 Z"/>
  </g>
</svg>`;

// Pinned source: always its team. Main source: whoever is talking / has the voice
// ("default" goblin for someone with the voice but no team); hidden when nobody does.
function displayTeam() {
  if (PIN_TEAM) return PIN_TEAM;
  if (currentId === null && !state?.voice?.user) return null;
  return talkingTeam || state?.voice?.team || "default";
}

let renderedKey = null;
function render() {
  const team = displayTeam();
  goblinEl.classList.toggle("hidden", !team);
  const talking = currentId !== null && (!PIN_TEAM || talkingTeam === PIN_TEAM);
  const a = assets[team] || assets.default || {};
  const tint = state?.tints?.[team];  // {color, strength}; none for the "default" goblin
  const color = tint?.color || "#7fbf3f";
  const strength = tint?.strength ?? 0;
  const key = `${team}|${talking}|${color}|${strength}|${a.idle}|${a.talk}`;
  if (key !== renderedKey) {
    renderedKey = key;
    const src = talking ? (a.talk || a.idle) : (a.idle || a.talk);
    if (src) {
      const layer = strength > 0
        ? `<div class="tint" style="background:${color};opacity:${strength};-webkit-mask-image:url('${src}');mask-image:url('${src}')"></div>` : "";
      goblinEl.innerHTML = `<img src="${src}">${layer}`;
    } else {
      goblinEl.innerHTML = PLACEHOLDER(color);
      goblinEl.querySelector(".ph").classList.toggle("talking", talking);
    }
  }
  const showName = SHOW_LABEL && state?.voice?.user && (!PIN_TEAM || state.voice.team === PIN_TEAM);
  labelEl.textContent = showName ? state.voice.user : "";
  labelEl.style.background = showName && state.voice.team ? (state.tints[state.voice.team].color + "cc") : "#0008";
  labelEl.classList.toggle("hidden", !showName);
}

function stopTalking(id) {
  if (id !== undefined && id !== currentId) return;
  currentId = null; talkingTeam = null;
  if (PLAY_AUDIO) { audio.pause(); audio.removeAttribute("src"); }
  render();
}

function onSpeak(msg) {
  currentId = msg.id; talkingTeam = msg.team;
  render();
  if (!PLAY_AUDIO) return;
  audio.src = msg.url;
  audio.onended = () => { send({ type: "ended", id: msg.id }); stopTalking(msg.id); };
  audio.onerror = audio.onended;
  audio.play().catch(() => { unlockEl.style.display = "block"; audio.onended(); });
}

function send(obj) { if (ws?.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") { state = msg; render(); }
    else if (msg.type === "speak") onSpeak(msg);
    else if (msg.type === "idle" || msg.type === "stop") stopTalking(msg.id);
    else if (msg.type === "assets") loadAssets();
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

unlockEl.onclick = () => { unlockEl.style.display = "none"; audio.play().catch(() => {}); };
function loadAssets() {
  return fetch("/api/assets").then(r => r.json()).then(a => { assets = a.teams; renderedKey = null; render(); });
}
fetch("/api/state").then(r => r.json()).then(s => { state = state || s; render(); }).catch(() => {});
loadAssets().finally(connect);
</script>
</body>
</html>
