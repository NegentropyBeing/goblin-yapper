<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Goblin Yapper Overlay</title>
<!--
  OBS browser source. Query params:
    ?team=azul   always show this team's goblin; it animates and plays audio only for that team's lines
    ?audio=0     never play audio here
  Without ?team it is the main source: shows whoever is speaking and plays the lines of teams that
  have no source of their own. The server picks exactly one source to play each line.
    ?label=0     hide the speaker name (and its strip)
    ?size=400    fixed 400 x 400 px goblin box; without it the goblin fills the whole source
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  /* The goblin fills the whole source (minus the name strip), so the OBS source's bounds hug the image.
     With ?size=N it is a fixed N x N px box instead. */
  .goblin { position: relative; width: 100%; flex: 1 1 0; min-height: 0; isolation: isolate; transition: opacity .25s; }
  body.fixed .goblin { width: var(--size); height: var(--size); flex: none; }
  .goblin.hidden { opacity: 0; }
  .goblin img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Tint layer: masked by the goblin image so only its pixels get colored. */
  .goblin .tint { position: absolute; inset: 0; mix-blend-mode: color; pointer-events: none;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; }
  /* The name strip keeps its height even when empty, so the goblin doesn't jump when someone gets the voice. */
  .label { flex: none; margin: 4px 0 2px; padding: .15em .7em; border-radius: 999px; color: #fff; font-weight: 700;
    font-size: clamp(12px, 7vh, 44px); line-height: 1.3; min-height: 1.3em; max-width: 96%; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000a; background: #0008; transition: opacity .25s; }
  body.fixed .label { font-size: calc(var(--size) / 14); }
  body.nolabel .label { display: none; }
  .label:empty, .label.hidden { opacity: 0; }
  /* Built-in goblin ("goburin", drawn as SVG; used when assets/ has no images).
     Talking: the closed frown is swapped for an open mouth that yaps, and the head bobs. */
  .ph .mouth-open { opacity: 0; transform-origin: 631px 772px; transform: scaleY(.3); }
  .ph.talking .mouth-closed { opacity: 0; }
  /* --speed: the panel's gif speed (1 = normal) */
  .ph.talking .mouth-open { opacity: 1; animation: yap calc(.16s / var(--speed, 1)) infinite alternate ease-in-out; }
  .ph.talking .head { animation: bob calc(.32s / var(--speed, 1)) infinite alternate ease-in-out; transform-origin: 630px 890px; }
  @keyframes yap { to { transform: scaleY(1); } }
  @keyframes bob { to { transform: rotate(3deg) translateY(-10px); } }
  #unlock { position: absolute; top: 8px; left: 8px; padding: 6px 10px; background: #000c; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="goblin hidden" id="goblin"></div>
  <div class="label hidden" id="label"></div>
</div>
<div id="unlock" data-i18n="overlay.unlock"></div>
<script src="/web/i18n.js"></script>
<script>
const params = new URLSearchParams(location.search);
const PIN_TEAM = params.get("team");
const PLAY_AUDIO = params.get("audio") !== "0";
const SHOW_LABEL = params.get("label") !== "0";
const PREVIEW = params.has("preview");  // the panel's thumbnails
if (params.get("size")) {  // fixed box; without it the goblin fills the source
  document.documentElement.style.setProperty("--size", params.get("size") + "px");
  document.body.classList.add("fixed");
}
if (!SHOW_LABEL) document.body.classList.add("nolabel");

const goblinEl = document.getElementById("goblin");
const labelEl = document.getElementById("label");
const unlockEl = document.getElementById("unlock");
let assets = {}, state = null;
// Lines playing now: id -> {team, user, audio (only for the ones this source plays)}. Usually one;
// several at once when every team speaks together.
const lines = new Map();
const lastLine = () => [...lines.values()].pop();
const teamTalking = (team) => [...lines.values()].some(l => l.team === team);
let ws;

const PLACEHOLDER = (color) => `
<svg class="ph" viewBox="90 330 1100 580" width="100%" height="100%">
  <defs>
    <!-- the bite out of the right ear: a real hole (transparent), not a painted dot -->
    <mask id="ear-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="1300" height="1300">
      <rect width="1300" height="1300" fill="#fff"/>
      <path fill="#000" d="M992 512 C992 492 1012 486 1032 488 C1046 489 1054 496 1054 506 L1090 540 L1040 590 L1010 548 C998 544 992 530 992 512 Z"/>
    </mask>
  </defs>
  <g class="head">
    <path fill="${color}" mask="url(#ear-bite)" d="M425 505 C380 482 260 455 128 420 C112 417 110 432 122 441 C170 480 222 515 250 545 C292 600 328 668 360 688 C375 696 395 696 402 695 C430 760 520 862 630 888 C700 890 790 800 848 697 C890 690 930 660 960 620 C1000 570 1050 512 1134 442 C1146 432 1142 417 1127 420 C1020 448 900 484 832 512 C800 442 720 378 620 377 C530 378 460 430 425 505 Z"/>
    <path fill="#fff" d="M425 612 C428 565 500 535 545 560 C570 590 548 640 495 642 C455 643 425 632 425 612 Z"/>
    <circle cx="510" cy="592" r="32" fill="#111"/><circle cx="507" cy="601" r="11" fill="#fff"/><circle cx="521" cy="578" r="5" fill="#fff"/>
    <path fill="#fff" d="M642 578 C660 520 740 482 795 510 C820 540 805 615 740 625 C690 630 655 600 642 578 Z"/>
    <circle cx="746" cy="553" r="35" fill="#111"/><circle cx="740" cy="565" r="12" fill="#fff"/><circle cx="759" cy="550" r="6" fill="#fff"/>
    <path class="mouth-closed" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" d="M577 775 C595 764 615 762 640 762 C660 762 672 768 686 775"/>
    <path class="mouth-open" fill="#2a0d0d" stroke="#fff" stroke-width="8" stroke-linejoin="round" d="M577 772 C600 752 662 752 686 772 C672 815 592 815 577 772 Z"/>
  </g>
</svg>`;

// Pinned source: always its team; with "hide idle" on (panel toggle), only while the team has a
// speaker or a line of its own playing. Main source: whoever is talking / has the voice
// ("default" goblin for someone with the voice but no team); hidden when nobody does.
function displayTeam() {
  if (PIN_TEAM) {
    const inUse = teamTalking(PIN_TEAM) || (state?.speakers || []).some(sp => sp.team === PIN_TEAM);
    return inUse || !state?.hide_idle || PREVIEW ? PIN_TEAM : null;
  }
  if (!lines.size && !state?.voice?.user) return null;
  return lastLine()?.team || state?.voice?.team || "default";
}

let renderedKey = null;
function render() {
  const team = displayTeam();
  goblinEl.classList.toggle("hidden", !team);
  const talking = PIN_TEAM ? teamTalking(PIN_TEAM) : lines.size > 0;
  const a = assets[team] || assets.default || {};
  const tint = state?.tints?.[team];  // {color, strength}; none for the "default" goblin
  const color = tint?.color || "#7fbf3f";
  const strength = tint?.strength ?? 0;
  const speed = state?.gif_speed ?? 100;  // % of the gif's own speed; the server rescales the frame delays
  goblinEl.style.setProperty("--speed", speed / 100);
  const key = `${team}|${talking}|${color}|${strength}|${a.idle}|${a.talk}|${speed}`;
  if (team && key !== renderedKey) {  // a hidden goblin keeps its last image while it fades out
    renderedKey = key;
    let src = talking ? (a.talk || a.idle) : (a.idle || a.talk);
    if (src?.split("?")[0].endsWith(".gif") && speed !== 100) src += `&speed=${speed}`;
    if (src) {
      const layer = strength > 0
        ? `<div class="tint" style="background:${color};opacity:${strength};-webkit-mask-image:url('${src}');mask-image:url('${src}')"></div>` : "";
      goblinEl.innerHTML = `<img src="${src}">${layer}`;
    } else {
      goblinEl.innerHTML = PLACEHOLDER(color);
      goblinEl.querySelector(".ph").classList.toggle("talking", talking);
    }
  }
  // Label: a pinned source names its own team's speaker; the main source names whoever is
  // talking right now, else the most recent speaker. Several teams can have a speaker at once.
  const speakers = state?.speakers || [];
  const who = PIN_TEAM
    ? speakers.find(sp => sp.team === PIN_TEAM)
    : (lastLine()?.user ? lastLine() : state?.voice);
  const showName = SHOW_LABEL && !!who?.user;
  labelEl.textContent = showName ? who.user : "";
  labelEl.style.background = showName && who.team && state.tints[who.team] ? (state.tints[who.team].color + "cc") : "#0008";
  labelEl.classList.toggle("hidden", !showName);
}

// The panel's volume slider (state.volume, 0..100), also applied to the lines already playing.
const volume = () => (state?.volume ?? 100) / 100;
function applyVolume() { for (const line of lines.values()) if (line.audio) line.audio.volume = volume(); }

function stopTalking(id) {
  const line = lines.get(id);
  if (!line) return;
  lines.delete(id);
  if (line.audio) { line.audio.onended = line.audio.onerror = null; line.audio.pause(); }
  render();
}

function onSpeak(msg) {
  const line = { team: msg.team, user: msg.user };
  lines.set(msg.id, line);
  render();
  // The server picks one overlay per line (msg.play): this team's own source if it has audio,
  // otherwise the main one. Every overlay still gets the line, to animate its goblin if it's the speaker's.
  if (!PLAY_AUDIO || !msg.play) return;
  const audio = line.audio = new Audio(msg.url);
  audio.volume = volume();
  audio.onended = () => { send({ type: "ended", id: msg.id }); stopTalking(msg.id); };
  audio.onerror = audio.onended;
  audio.play().catch(() => { unlockEl.style.display = "block"; audio.onended(); });
}

function send(obj) { if (ws?.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  // ?preview=1 (the panel's thumbnails) doesn't count as an OBS source
  ws.onopen = () => send({ type: "hello", role: PREVIEW ? "preview" : "overlay", team: PIN_TEAM, audio: PLAY_AUDIO });
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") { state = msg; applyLanguage(); applyVolume(); render(); }
    else if (msg.type === "speak") onSpeak(msg);
    else if (msg.type === "idle" || msg.type === "stop") stopTalking(msg.id);
    else if (msg.type === "assets") loadAssets();
  };
  ws.onclose = () => {
    // their "idle" would be missed while offline; the ones playing here end by themselves
    for (const [id, line] of lines) if (!line.audio) lines.delete(id);
    render(); setTimeout(connect, 1500);
  };
}

unlockEl.onclick = () => { unlockEl.style.display = "none"; };  // the click itself lets the next lines play
function loadAssets() {
  return fetch("/api/assets").then(r => r.json()).then(a => { assets = a.teams; renderedKey = null; render(); });
}
// Only the "click to unlock the audio" hint is text; it follows the panel's interface language.
let shownLanguage = null;
async function applyLanguage() {
  const lang = i18n.resolveLanguage(state?.language);
  if (lang === shownLanguage) return;
  shownLanguage = lang;
  await i18n.load(lang);
  i18n.apply();
}
fetch("/api/state").then(r => r.json()).then(s => { state = state || s; applyLanguage(); render(); }).catch(() => {});
loadAssets().finally(connect);
</script>
</body>
</html>
